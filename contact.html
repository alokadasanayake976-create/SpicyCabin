  <!-- ================= PAGE TITLE ================= -->

  <h1 class="gradient-heading">
    For FURTHER INFO...
  </h1>


  <!-- ================= BANNER IMAGE ================= -->

  <div class="container-fluid p-0">

    <img
      src="assets/images/photo16.png"
      class="img-fluid w-100"
      alt="Contact Spicy Cabin"
    >

  </div>


  <!-- ================= CONTACT FORM ================= -->

  <div class="container my-5">

    <div class="form-container">

      <h2 class="mb-4">
        Contact Us
      </h2>

      <form>

        <!-- Full Name -->
        <div class="mb-3">

          <label
            for="username"
            class="form-label"
          >
            Full Name
          </label>

          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Kamal Chaminda"
            required
          >

        </div>


        <!-- Email -->
        <div class="mb-3">

          <label
            for="email"
            class="form-label"
          >
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="example@gmail.com"
            required
          >

        </div>


        <!-- Message -->
        <div class="mb-3">

          <label
            for="message"
            class="form-label"
          >
            Message
          </label>

          <textarea
            id="message"
            name="message"
            class="form-control"
            rows="5"
            placeholder="Write your message here..."
            required
          ></textarea>

        </div>


        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-success"
        >
          Send Message
        </button>

      </form>

    </div>

  </div>


  <!-- ================= GOOGLE MAP ================= -->

  <div class="container my-5">

    <h2 class="text-center mb-4">
      Find Us
    </h2>

    <div class="map-container">

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12001.506036300325!2d80.1146305334126!3d6.735165696211873!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae3b35e4cd78e69%3A0xd5260864a578c9f5!2sPoruwadanda!5e1!3m2!1sen!2slk!4v1788090779229!5m2!1sen!2slk"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        title="Spicy Cabin Location"
      ></iframe>

    </div>

  </div>

    crossorigin="anonymous"
